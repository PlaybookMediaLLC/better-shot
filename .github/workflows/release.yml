name: Release

on:
  workflow_call:
    inputs:
      version:
        description: "Semantic version without the v prefix"
        required: true
        type: string
      tested_sha:
        description: "Main commit whose Tests workflow authorized this release"
        required: true
        type: string
      publish_release:
        description: "Publish the draft after both notarized DMGs succeed"
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: better-shot-stable-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      release_sha: ${{ steps.provenance.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Validate semantic release provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          if ! [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid tested commit SHA: $TESTED_SHA"
            exit 1
          fi

          VERSION_JSON=$(node -p "require('./version.json').version")
          if [ "$VERSION_JSON" != "$RELEASE_VERSION" ]; then
            echo "::error::version.json contains $VERSION_JSON, expected $RELEASE_VERSION."
            exit 1
          fi

          git fetch origin main --tags --force
          TAG_SHA=$(git rev-list -n1 "$RELEASE_TAG")
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$CHECKOUT_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, but checkout is $CHECKOUT_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Release commit $TAG_SHA is not part of origin/main."
            exit 1
          fi
          PARENT_SHA=$(git rev-parse "$TAG_SHA^")
          if [ "$PARENT_SHA" != "$TESTED_SHA" ]; then
            echo "::error::Release commit parent $PARENT_SHA does not match tested main commit $TESTED_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TESTED_SHA" origin/main; then
            echo "::error::Tested commit $TESTED_SHA is not part of origin/main."
            exit 1
          fi

          EXPECTED_SUBJECT="chore(release): $RELEASE_VERSION [skip ci]"
          ACTUAL_SUBJECT=$(git log -1 --format=%s "$TAG_SHA")
          if [ "$ACTUAL_SUBJECT" != "$EXPECTED_SUBJECT" ]; then
            echo "::error::Unexpected release commit subject: $ACTUAL_SUBJECT"
            exit 1
          fi

          EXPECTED_FILES=$(printf '%s\n' \
            BetterShot.xcodeproj/project.pbxproj \
            CHANGELOG.md \
            project.yml \
            version.json)
          ACTUAL_FILES=$(git diff-tree --no-commit-id --name-only -r "$TAG_SHA" | LC_ALL=C sort)
          if [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
            echo "::error::Release commit changed files outside the semantic-release allowlist."
            diff -u <(printf '%s\n' "$EXPECTED_FILES") <(printf '%s\n' "$ACTUAL_FILES") || true
            exit 1
          fi

          TEST_RUN=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow tests.yml \
            --commit "$TESTED_SHA" \
            --event push \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0]')
          if [ -z "$TEST_RUN" ] || [ "$TEST_RUN" = "null" ]; then
            echo "::error::No Tests workflow run exists for $TESTED_SHA."
            exit 1
          fi
          if [ "$(jq -r .status <<< "$TEST_RUN")" != "completed" ] || \
             [ "$(jq -r .conclusion <<< "$TEST_RUN")" != "success" ]; then
            echo "::error::Tests did not pass for $TESTED_SHA."
            exit 1
          fi

          RELEASE_DATA=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish)
          if [ "$(jq -r .tagName <<< "$RELEASE_DATA")" != "$RELEASE_TAG" ]; then
            echo "::error::Draft release tag does not match $RELEASE_TAG."
            exit 1
          fi
          if [ "$(jq -r .isDraft <<< "$RELEASE_DATA")" != "true" ]; then
            echo "::error::Release $RELEASE_TAG must still be a draft before artifact publication."
            exit 1
          fi
          echo "release_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Read build number
        id: version
        run: |
          BUILD_NUMBER=$(node -p "require('./version.json').build")
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid build number: $BUILD_NUMBER"
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build-unsigned:
    needs: prepare-release
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Build unsigned ${{ matrix.arch }} app
        env:
          BUILD_NUMBER: ${{ needs.prepare-release.outputs.build_number }}
        run: |
          DERIVED_DATA="$RUNNER_TEMP/BetterShot-${{ matrix.arch }}"
          xcodebuild \
            -project BetterShot.xcodeproj \
            -scheme BetterShot \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release/BetterShot.app"
          test -d "$APP_PATH"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)" = "$RELEASE_VERSION"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleVersion)" = "$BUILD_NUMBER"
          ARCHITECTURES=$(lipo -archs "$APP_PATH/Contents/MacOS/BetterShot")
          test "$ARCHITECTURES" = "${{ matrix.arch }}"
          ARCHIVE_PATH="$RUNNER_TEMP/BetterShot-$RELEASE_VERSION-${{ matrix.arch }}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      - name: Upload unsigned ${{ matrix.arch }} app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: better-shot-unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}/BetterShot-${{ inputs.version }}-${{ matrix.arch }}-unsigned.zip
          if-no-files-found: error
          retention-days: 1

  sign-notarize:
    needs: [prepare-release, build-unsigned]
    runs-on: macos-latest
    environment: apple-release
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Download unsigned ${{ matrix.arch }} app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: better-shot-unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned

      - name: Validate unsigned app and materialize fixed entitlements
        env:
          BUILD_NUMBER: ${{ needs.prepare-release.outputs.build_number }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/unsigned/BetterShot-$RELEASE_VERSION-${{ matrix.arch }}-unsigned.zip"
          EXTRACT_DIR="$RUNNER_TEMP/unsigned-app"
          test -f "$ARCHIVE_PATH"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$ARCHIVE_PATH" "$EXTRACT_DIR"
          APP_PATH="$EXTRACT_DIR/BetterShot.app"
          test -d "$APP_PATH"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)" = "$RELEASE_VERSION"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleVersion)" = "$BUILD_NUMBER"
          ARCHITECTURES=$(lipo -archs "$APP_PATH/Contents/MacOS/BetterShot")
          test "$ARCHITECTURES" = "${{ matrix.arch }}"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/BetterShot.entitlements"
          cat > "$ENTITLEMENTS_PATH" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          {
            echo "APP_PATH=$APP_PATH"
            echo "ENTITLEMENTS_PATH=$ENTITLEMENTS_PATH"
          } >> "$GITHUB_ENV"

      - name: Require complete Apple signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing Apple release secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All Apple signing and notarization secrets are configured."

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/better-shot-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/better-shot-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity was imported."
            exit 1
          fi

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Sign and verify ${{ matrix.arch }} app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          while IFS= read -r -d '' NESTED_CODE; do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              "$NESTED_CODE"
          done < <(find "$APP_PATH/Contents" -depth \
            \( -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.plugin' -o -name '*.xpc' \) \
            -o -type f -name '*.dylib' \) \
            ! -path "$APP_PATH" -print0)

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNATURE_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          grep -F "Authority=Developer ID Application:" <<< "$SIGNATURE_DETAILS"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$SIGNATURE_DETAILS"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create, sign, and notarize ${{ matrix.arch }} DMG
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/release-${{ matrix.arch }}"
          STAGING_DIR="$RUNNER_TEMP/dmg-${{ matrix.arch }}"
          DMG_PATH="$OUTPUT_DIR/BetterShot-$RELEASE_VERSION-${{ matrix.arch }}.dmg"
          mkdir -p "$OUTPUT_DIR" "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/BetterShot.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "BetterShot" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          codesign \
            --force \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          trap 'rm -f "$API_KEY_PATH"' EXIT
          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          rm -f "$API_KEY_PATH"
          trap - EXIT
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 "$(basename "$DMG_PATH")" > "$(basename "$DMG_PATH").sha256"
          )
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload notarized ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: better-shot-notarized-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release-${{ matrix.arch }}/*.dmg
            ${{ runner.temp }}/release-${{ matrix.arch }}/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/better-shot-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/better-shot-developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish-release:
    if: inputs.publish_release
    needs: [prepare-release, sign-notarize]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Download notarized artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: better-shot-notarized-*
          path: release
          merge-multiple: true

      - name: Verify complete release asset set
        run: |
          test -f "release/BetterShot-$RELEASE_VERSION-arm64.dmg"
          test -f "release/BetterShot-$RELEASE_VERSION-x86_64.dmg"
          test -f "release/BetterShot-$RELEASE_VERSION-arm64.dmg.sha256"
          test -f "release/BetterShot-$RELEASE_VERSION-x86_64.dmg.sha256"
          (cd release && sha256sum -c BetterShot-*.dmg.sha256)
          (cd release && sha256sum BetterShot-*.dmg > SHA256SUMS)

      - name: Revalidate draft, upload exact assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          expected_assets=$(printf '%s\n' \
            "BetterShot-$RELEASE_VERSION-arm64.dmg" \
            "BetterShot-$RELEASE_VERSION-arm64.dmg.sha256" \
            "BetterShot-$RELEASE_VERSION-x86_64.dmg" \
            "BetterShot-$RELEASE_VERSION-x86_64.dmg.sha256" \
            SHA256SUMS | LC_ALL=C sort)

          revalidate_draft() {
            mode=${1:-subset}
            git fetch origin main --tags --force
            remote_tag_sha=$(git rev-list -n1 "$RELEASE_TAG")
            if [ "$remote_tag_sha" != "$EXPECTED_RELEASE_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG moved from $EXPECTED_RELEASE_SHA to $remote_tag_sha."
              exit 1
            fi
            release_data=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName,assets)
            if [ "$(jq -r .tagName <<< "$release_data")" != "$RELEASE_TAG" ] || \
               [ "$(jq -r .isDraft <<< "$release_data")" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is no longer the expected draft."
              exit 1
            fi
            existing_assets=$(jq -r '.assets[].name' <<< "$release_data" | LC_ALL=C sort)
            unexpected_assets=$(comm -23 \
              <(printf '%s\n' "$existing_assets" | sed '/^$/d') \
              <(printf '%s\n' "$expected_assets"))
            if [ -n "$unexpected_assets" ]; then
              echo "::error::Draft contains unexpected assets:"
              printf '%s\n' "$unexpected_assets"
              exit 1
            fi
            if [ "$mode" = "exact" ] && [ "$existing_assets" != "$expected_assets" ]; then
              echo "::error::Draft asset set changed before publication."
              diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$existing_assets") || true
              exit 1
            fi
          }

          revalidate_draft
          gh release upload "$RELEASE_TAG" \
            "release/BetterShot-$RELEASE_VERSION-arm64.dmg" \
            "release/BetterShot-$RELEASE_VERSION-arm64.dmg.sha256" \
            "release/BetterShot-$RELEASE_VERSION-x86_64.dmg" \
            "release/BetterShot-$RELEASE_VERSION-x86_64.dmg.sha256" \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          revalidate_draft
          actual_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "::error::Remote release asset set is incomplete or unexpected."
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          revalidate_draft exact
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Better Shot $RELEASE_TAG" \
            --draft=false \
            --latest
