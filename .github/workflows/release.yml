name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix"
        required: true
        type: string
      publish_release:
        description: "Publish the draft after both notarized DMGs succeed"
        required: true
        default: true
        type: boolean
      reuse_semantic_release:
        description: "Require and reuse the matching semantic-release draft and tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: better-shot-stable-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semantic release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          if [ "${{ inputs.reuse_semantic_release }}" != "true" ]; then
            echo "::error::Stable publication requires reuse_semantic_release=true."
            exit 1
          fi

          VERSION_JSON=$(node -p "require('./version.json').version")
          if [ "$VERSION_JSON" != "$RELEASE_VERSION" ]; then
            echo "::error::version.json contains $VERSION_JSON, expected $RELEASE_VERSION."
            exit 1
          fi

          git fetch origin main --tags --force
          TAG_SHA=$(git rev-list -n1 "$RELEASE_TAG")
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, but this workflow is building $GITHUB_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not part of origin/main."
            exit 1
          fi

          RELEASE_DATA=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish)
          if [ "$(jq -r .tagName <<< "$RELEASE_DATA")" != "$RELEASE_TAG" ]; then
            echo "::error::Draft release tag does not match $RELEASE_TAG."
            exit 1
          fi
          if [ "$(jq -r .isDraft <<< "$RELEASE_DATA")" != "true" ]; then
            echo "::error::Release $RELEASE_TAG must still be a draft before artifact publication."
            exit 1
          fi

      - name: Require complete Apple signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing Apple release secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All Apple signing and notarization secrets are configured."

      - name: Read build number
        id: version
        run: |
          BUILD_NUMBER=$(node -p "require('./version.json').build")
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid build number: $BUILD_NUMBER"
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate and notarization key
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/better-shot-developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/better-shot-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity was imported."
            exit 1
          fi

          {
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build signed ${{ matrix.arch }} app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ needs.prepare-release.outputs.build_number }}
        run: |
          DERIVED_DATA="$RUNNER_TEMP/BetterShot-${{ matrix.arch }}"
          xcodebuild \
            -project BetterShot.xcodeproj \
            -scheme BetterShot \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release/BetterShot.app"
          test -d "$APP_PATH"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)" = "$RELEASE_VERSION"
          test "$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleVersion)" = "$BUILD_NUMBER"
          ARCHITECTURES=$(lipo -archs "$APP_PATH/Contents/MacOS/BetterShot")
          test "$ARCHITECTURES" = "${{ matrix.arch }}"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNATURE_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          grep -F "Authority=Developer ID Application:" <<< "$SIGNATURE_DETAILS"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$SIGNATURE_DETAILS"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create, sign, and notarize ${{ matrix.arch }} DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/release-${{ matrix.arch }}"
          STAGING_DIR="$RUNNER_TEMP/dmg-${{ matrix.arch }}"
          DMG_PATH="$OUTPUT_DIR/BetterShot-$RELEASE_VERSION-${{ matrix.arch }}.dmg"
          mkdir -p "$OUTPUT_DIR" "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/BetterShot.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "BetterShot" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          codesign \
            --force \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 "$(basename "$DMG_PATH")" > "$(basename "$DMG_PATH").sha256"
          )
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload notarized ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: better-shot-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release-${{ matrix.arch }}/*.dmg
            ${{ runner.temp }}/release-${{ matrix.arch }}/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/better-shot-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/better-shot-developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish-release:
    if: inputs.publish_release
    needs: [prepare-release, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download notarized artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: better-shot-*
          path: release
          merge-multiple: true

      - name: Verify complete release asset set
        run: |
          test -f "release/BetterShot-$RELEASE_VERSION-arm64.dmg"
          test -f "release/BetterShot-$RELEASE_VERSION-x86_64.dmg"
          test -f "release/BetterShot-$RELEASE_VERSION-arm64.dmg.sha256"
          test -f "release/BetterShot-$RELEASE_VERSION-x86_64.dmg.sha256"
          (cd release && sha256sum -c BetterShot-*.dmg.sha256)
          (cd release && sha256sum BetterShot-*.dmg > SHA256SUMS)

      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Better Shot $RELEASE_TAG" \
            --draft=false \
            --latest
